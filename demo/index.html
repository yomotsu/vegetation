<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="data:," />
		<title>Vegetation Preview</title>
		<style>
			html,
			body,
			#app {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
			}

			body {
				font-family: Inter, ui-sans-serif, system-ui, sans-serif;
				color: #20312d;
				background: #c8e0e9;
			}

			#app {
				position: relative;
			}

			#canvas {
				position: absolute;
				inset: 0;
			}

			#canvas canvas {
				display: block;
				width: 100%;
				height: 100%;
			}

			#topbar {
				position: absolute;
				z-index: 2;
				top: 18px;
				left: 18px;
				padding: 10px 14px;
				border: 1px solid rgba(255, 255, 255, 0.65);
				border-radius: 12px;
				background: rgba(248, 252, 247, 0.78);
				box-shadow: 0 8px 24px rgba(38, 57, 47, 0.12);
				backdrop-filter: blur(8px);
			}

			#title {
				font-size: 14px;
				font-weight: 700;
				letter-spacing: 0.02em;
			}

			#renderer-label {
				margin-top: 3px;
				font-size: 11px;
				color: #5b7167;
			}

			#status {
				position: absolute;
				z-index: 2;
				bottom: 18px;
				left: 18px;
				padding: 8px 11px;
				border-radius: 9px;
				background: rgba(248, 252, 247, 0.8);
				font-size: 12px;
				font-variant-numeric: tabular-nums;
				box-shadow: 0 5px 18px rgba(38, 57, 47, 0.1);
			}

			#compare-labels {
				position: absolute;
				z-index: 1;
				inset: 0;
				overflow: hidden;
				pointer-events: none;
			}

			.compare-label {
				position: absolute;
				padding: 5px 8px;
				border: 1px solid rgba(255, 255, 255, 0.72);
				border-radius: 8px;
				background: rgba(31, 48, 42, 0.76);
				color: #f4f7eb;
				font-size: 11px;
				white-space: pre;
				text-align: left;
				transform: translate(-50%, -100%);
				box-shadow: 0 4px 14px rgba(24, 38, 31, 0.14);
			}

			.lil-gui {
				--background-color: rgba(248, 252, 247, 0.92);
				--text-color: #20312d;
				--title-background-color: #edf4e8;
				--widget-color: #dce8d6;
				--hover-color: #cddfc3;
				--focus-color: #92b985;
				--number-color: #2d6947;
				--string-color: #794f35;
				z-index: 3 !important;
				margin: 18px !important;
				box-shadow: 0 8px 24px rgba(38, 57, 47, 0.12);
			}
		</style>
	</head>
	<body>
		<div id="app">
			<div id="canvas"></div>
			<div id="topbar">
				<div id="title">Vegetation Preview</div>
				<div id="renderer-label">Starting renderer…</div>
			</div>
			<div id="compare-labels"></div>
			<div id="status">Ready</div>
		</div>
		<script type="module" src="/main.ts"></script>
	</body>
</html>
